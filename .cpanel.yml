---
# Security update for PHP, Composer dependencies and frontend assets.
# Deployment requires verified database and upload backups.
deployment:
  tasks:
    - export PHP_BIN=/opt/cpanel/ea-php85/root/usr/bin/php
    - /bin/sh -n laravel-app/tools/check-php-runtime.sh || exit 1
    - /bin/sh laravel-app/tools/check-php-runtime.sh || exit 1
    - $PHP_BIN -d session.upload_progress.enabled=0 laravel-app/tools/release-guard.php deploy /home1/edarat/deploy-backups/edarat365-20261122-security-v1 || exit 1
    - echo "Security release complete. Existing database rows and uploads verified."
